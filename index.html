<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#faf7f2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="잡로그">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>잡로그</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#2b2622;--sub:#8a8179;--line:#ece5dc;--ac:#e8845f;--acbg:#fdeee7;--ok:#4e9a6b;--warn:#d9534f;--best:#2f7de1;--fs:15px;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:var(--fs)/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding-top:env(safe-area-inset-top,0px)}
button,input,select,textarea{font-family:inherit;font-weight:inherit}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column}
header{padding:12px 14px 8px;display:flex;align-items:center;justify-content:space-between}
h1{font-size:1.3em;margin:0}
.add{background:var(--ac);color:#fff;border:0;border-radius:99px;padding:8px 15px;font-size:.95em;font-weight:700}
main{flex:1;overflow-y:auto;padding:0 14px 16px}
.bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
select,input,textarea{font-size:max(16px,1em);color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
.bar select{width:auto;font-size:16px;padding:6px 8px}
.chip{display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 11px;font-size:.88em;margin:0 4px 6px 0}
.chip.on{background:var(--acbg);color:var(--ac);border-color:var(--ac);font-weight:700}
.wrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line);background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:680px;font-size:.88em}
th,td{padding:10px 9px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--sub);font-size:.85em;background:var(--acbg)}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
td.n{font-weight:700;white-space:normal;min-width:100px}
.best{color:var(--best);font-weight:700}.bad{color:var(--warn)}
.sub{color:var(--sub);font-size:.82em;font-weight:400}
.tag{display:inline-block;font-size:.75em;padding:1px 7px;border-radius:99px;background:var(--acbg);color:var(--ac);font-weight:700;margin-left:4px}
.tag.red{background:var(--warn);color:#fff}.tag.dz{background:#fde8e8;color:#a83232}.tag.gray{background:var(--line);color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.card.done{opacity:.55}
.rc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;transition:opacity .3s;position:relative}
.rc.exp{opacity:.65}.rw2{cursor:pointer}.ct{display:flex;align-items:center;gap:4px}
.ed{border:0;background:transparent;color:var(--sub);padding:4px;line-height:0;border-radius:8px}.ed:active{background:var(--acbg)}
.pn{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}.pn>div{overflow:hidden}.rc.open .pn{grid-template-rows:1fr}
.in{padding-top:10px;opacity:0;transform:translateY(-10px);transition:opacity .3s ease,transform .3s ease}.rc.open .in{opacity:1;transform:none}
.ok{width:100%;border:1px solid var(--ac);background:var(--acbg);color:var(--ac);border-radius:10px;padding:9px;font-size:.95em;font-weight:700}
.rc.done .ok{background:var(--card);color:var(--sub);border-color:var(--line)}
.tag.okg{background:var(--ok);color:#fff}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.tag.pp{animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
.cb{border:1px solid var(--line);background:var(--acbg);color:var(--tx);border-radius:99px;padding:1px 9px;font-size:.78em;font-weight:700;margin-left:6px;vertical-align:middle}
.cb i{font-style:normal;color:var(--best);margin-left:4px}.cb i.dn{color:var(--warn)}
.pop{position:absolute;left:12px;width:min(260px,calc(100% - 24px));background:var(--card);border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.18);border-radius:12px;padding:8px 11px;z-index:5;animation:pin .22s cubic-bezier(.34,1.56,.64,1)}
.pop:before{content:"";position:absolute;top:-6px;left:var(--ax,40px);width:10px;height:10px;background:var(--card);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.lr{display:flex;justify-content:space-between;font-size:.85em;padding:4px 0;border-top:1px solid var(--line);color:var(--sub)}.lr:first-child{border:0}
.lr b{color:var(--tx)}.lr em{font-style:normal;color:var(--best);margin-left:6px}.lr em.dn{color:var(--warn)}
@keyframes pin{from{opacity:0;transform:translateY(-6px) scale(.96)}}
.lk{display:inline-block;font-size:.85em;padding:0 8px;border-radius:99px;border:1px solid var(--ac);color:var(--ac);margin-left:6px;text-decoration:none;font-weight:700}


.card{position:relative}
.mn{position:absolute;right:10px;background:var(--card);border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.18);border-radius:10px;padding:4px;z-index:6;min-width:150px;animation:pin .2s cubic-bezier(.34,1.56,.64,1)}
.mn div{padding:8px 11px;border-radius:7px;font-size:.92em}.mn div.p{color:var(--ac);font-weight:700}.mn div:active{background:var(--acbg)}
.dl{font-size:.72em;color:var(--sub);margin-left:3px}.dl.up{color:var(--best);font-weight:700}.st .dl{display:block;margin:0}
.r2{display:flex;gap:8px}.r2 .ok{width:auto;flex:1}
.hb{flex:1;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;padding:9px;font-size:.95em;font-weight:700}
.hr{display:flex;align-items:center;gap:6px;font-size:.85em;margin:5px 0}

.mc{display:flex;align-items:center;gap:10px;margin:0 0 10px}.mc svg{flex:none;animation:bob 2.4s ease-in-out infinite}
.bb{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 12px;font-size:.9em}
@keyframes bob{50%{transform:translateY(-3px)}}
.stamp{position:absolute;right:18px;top:42%;transform:rotate(-12deg);border:3px solid #E24B4A;color:#E24B4A;border-radius:10px;padding:2px 12px;font-weight:800;font-size:1.15em;background:var(--card);pointer-events:none;z-index:2;animation:slam .5s cubic-bezier(.2,.9,.3,1.2)}
.stamp.sm{top:auto;bottom:12px;right:12px;font-size:.8em;border-width:2px;padding:0 8px;opacity:.55;animation:none;background:transparent}
@keyframes slam{0%{opacity:0;transform:rotate(-12deg) scale(2.6)}100%{opacity:1;transform:rotate(-12deg) scale(1)}}
.rc.shake{animation:shk .3s .45s}@keyframes shk{25%{transform:translateY(3px)}60%{transform:translateY(-2px)}}
.pgb{height:10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);overflow:hidden}.pgb i{display:block;height:100%;background:var(--ac);transition:width .5s}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 14px 6px 8px;display:flex;align-items:center;gap:8px;font-size:.9em;font-weight:700;z-index:20;white-space:nowrap;animation:tin .3s cubic-bezier(.34,1.56,.64,1)}
.toast.out{opacity:0;transition:opacity .35s}@keyframes tin{from{opacity:0;transform:translate(-50%,12px)}}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 8px}.st div{background:var(--bg);border-radius:10px;padding:6px 2px;text-align:center}.st span{display:block;font-size:.72em;color:var(--sub)}.st b{font-size:.9em}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
label.c{display:flex;gap:9px;align-items:center;padding:5px 0}
input[type=checkbox]{width:19px;height:19px;accent-color:var(--ac);flex:none;padding:0}
.grp{font-size:.78em;color:var(--sub);margin:10px 0 4px;font-weight:600}
.empty{text-align:center;color:var(--sub);padding:40px 0}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--sub);font-size:.8em;padding:8px 0;font-weight:600}
nav button.on{color:var(--ac)}
nav b{display:block;line-height:0;padding:3px 0 4px}nav svg{display:block;margin:0 auto}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:10}
#sheet.show{display:flex}
.pane{background:var(--bg);width:100%;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom,0px))}
.pane h2{margin:0 0 10px;font-size:1.15em}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f{display:block;margin-bottom:6px}.f span{display:block;font-size:.8em;color:var(--sub);margin-bottom:3px}
.full{grid-column:1/-1}
.row{display:flex;gap:6px}.row button{flex:none}
.btns{display:flex;gap:8px;margin-top:10px}
.btns button,.bt{border:0;border-radius:12px;padding:11px 14px;font-weight:700;background:var(--line);color:var(--tx);font-size:.95em}
.btns button{flex:1}
.save{background:var(--ac)!important;color:#fff!important}.del{color:var(--warn)!important}
.tlr{display:flex;justify-content:flex-end;margin-bottom:6px}
.tlc{background:var(--acbg);border:1px solid var(--ac);color:color-mix(in srgb,var(--ac) 65%,#000);border-radius:99px;padding:3px 10px;font-size:.78em;font-weight:700}
.tlh,.tlrow{display:grid;grid-template-columns:68px 1fr;align-items:center;min-height:28px}
.tlh{margin-bottom:2px}.tlrow{cursor:pointer;border-top:1px solid var(--line)}
.tnm{font-size:.8em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:4px}
.tar{position:relative;display:grid;grid-template-columns:repeat(14,minmax(0,1fr));height:28px}
.tx{display:flex;align-items:center;justify-content:center;position:relative;z-index:1;font-size:.75em;color:var(--sub)}
.tx.su{color:var(--warn)}.tx.sa{color:var(--best)}.tx.td{background:var(--acbg)}
.tln{position:absolute;top:12px;height:4px;background:var(--line);border-radius:2px}
.tm{width:12px;height:12px;display:block;box-sizing:border-box;border-radius:3px;background:var(--ac)}
.tm.iv{background:var(--ok);border-radius:50%}.tm.cl{background:transparent;border:1.5px dashed var(--sub)}
.tm.dn{background:color-mix(in srgb,var(--sub) 45%,var(--card))}.tm.ivx{background:color-mix(in srgb,var(--sub) 45%,var(--card));border-radius:50%}
.kseg{display:flex;background:var(--line);border-radius:10px;padding:2px}.kseg button{flex:1;padding:8px 0;border:1px solid transparent;border-radius:8px;background:none;color:var(--sub);font-size:.95em;font-weight:600}.kseg button.on{background:var(--card);color:var(--tx);border-color:var(--line)}
.cwr{display:grid;grid-template-columns:repeat(7,1fr)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:10px;background:color-mix(in srgb,var(--line) 55%,var(--bg));border-radius:8px;padding:2px}
.cw{text-align:center;font-size:.78em;color:var(--sub);font-weight:800;padding:4px 0 6px}
.cd{min-height:76px;background:var(--card);border-radius:7px;padding:4px 3px;overflow:hidden;font-size:.78em}
.cd i{font-style:normal;font-weight:500;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:1.1em}
.cd .cr{position:relative;display:flex;justify-content:center;align-items:center}.cd .ap{position:absolute;right:0;top:0;color:var(--warn);font-weight:700;display:inline-flex;align-items:center;gap:1px}
.cwr .cw:nth-child(1){color:var(--warn)}.cwr .cw:nth-child(7){color:var(--best)}
.cd:nth-child(7n+1) i{color:var(--warn)}.cd:nth-child(7n) i{color:var(--best)}
.cd.td i{color:var(--ac);font-weight:800}.cd.sl{background:var(--acbg)}.cd.sl i{background:var(--tx);color:var(--card)}.cd.om{background:none;opacity:.4}
.cd em{display:block;font-style:normal;font-size:.8em;background:var(--ac);color:#fff;border-radius:4px;padding:0 3px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd em.dn{background:var(--line);color:var(--sub);text-decoration:line-through}
.sec{font-size:.8em;font-weight:800;color:var(--sub);margin:18px 2px 6px}
.cd em.iv{background:var(--ok)}
.cd em.iv.x{background:var(--line);color:var(--sub);text-decoration:line-through}
.cd em.cl{background:transparent;color:var(--sub);outline:1px dashed var(--sub);outline-offset:-1px}
.sb .cd em{background:color-mix(in srgb,var(--ac) 16%,var(--card));color:var(--tx);border-left:3px solid var(--ac);border-radius:0}
.sb .cd em.iv{background:color-mix(in srgb,var(--ok) 16%,var(--card));border-left-color:var(--ok)}
.sb .cd em.cl{background:color-mix(in srgb,var(--sub) 14%,var(--card));color:var(--sub);border-left-color:var(--sub);outline:0}
.sb .cd em.dn{background:var(--line);color:var(--sub);border-left-color:var(--line)}
.sb .cd em.iv.x{background:var(--line);color:var(--sub);border-left-color:var(--line)}
.sb .cd em.mo{background:none;color:var(--sub);border-left-color:var(--line)}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:700}
.mh button{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:6px 12px}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.swb{border:2px solid;border-radius:12px;padding:10px;text-align:left;font-weight:700;display:flex;gap:6px;align-items:center;font-size:.9em}
.swb span{width:16px;height:16px;border-radius:50%;display:inline-block}
.swb.on::after{content:"✓";margin-left:auto}
textarea{font-size:16px;min-height:90px}
label.c.tg2{padding:8px 0}
.rc.selm .pn,.rc.selm .ed{display:none}.rc.selm{cursor:pointer}.rc.selm .cb{pointer-events:none}.rc.selm .ct{margin-right:30px}
.rc.selm::after{content:"";position:absolute;right:12px;top:12px;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--card);box-sizing:border-box}
.rc.selm.picked{border-color:var(--ac);background:var(--acbg)}.rc.selm.picked::after{background:var(--ac);border-color:var(--ac);content:"✓";color:#fff;font-size:13px;text-align:center;line-height:18px;font-weight:800}
tr.picked td{background:var(--acbg)}
#selbar{position:sticky;bottom:8px;display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--ac);border-radius:14px;padding:8px 10px;box-shadow:0 4px 16px rgba(0,0,0,.15);margin-top:8px;z-index:5;font-weight:700;font-size:.9em}
#selbar button{border:0;background:none;color:var(--ac);font-weight:800;padding:6px 8px;font-size:1em}#selbar button.dn{color:var(--warn)}
.tag.or{background:#fff1de;color:#c06a0d}.tag.iv{background:var(--best);color:#fff}
.rc.u0{border:2px solid #e57373}.rc.u3{border:2px solid #f2b27a}.rc.u0,.rc.u3{padding:11px}
.rc.u0 .tag.dz{animation:blk 1.2s ease-in-out infinite}@keyframes blk{50%{opacity:.45}}
.dbar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--acbg);border-radius:10px;padding:8px 10px;margin-bottom:10px;font-size:.85em}
.dbar button{border:0;background:none;color:var(--ac);font-weight:700;padding:4px 6px;font-size:1em}.dbar button+button{color:var(--sub)}
.dup{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:-2px 0 8px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.dup>div{padding:9px 10px;border-top:1px solid var(--line);cursor:pointer}.dup>div:first-child{border-top:0}
.dup small{display:block;color:var(--sub);font-size:.8em}.dup em{font-style:normal;color:var(--warn);font-size:.8em;float:right}
.ok.clb{background:var(--card);color:var(--sub);border-color:var(--line)}
.rc.cl .ok.clb{color:var(--warn);border-color:var(--warn)}
.rc.cl-mini:not(.open) .st,.rc.cl-mini:not(.open) .rw2>.sub{display:none}
.rc.cl-mini{padding-top:9px;padding-bottom:9px}
input[type=search]{-webkit-appearance:none;appearance:none}
input.sw2{-webkit-appearance:none;appearance:none;width:44px;height:26px;border:0;border-radius:99px;background:var(--line);position:relative;flex:none;margin:0;padding:0;cursor:pointer;transition:background .2s}
input.sw2::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
input.sw2:checked{background:var(--ac)}
input.sw2:checked::after{transform:translateX(18px)}
.mc svg{cursor:pointer}
@keyframes hop{0%{transform:none}25%{transform:scale(1.15,.85)}55%{transform:translateY(-16px) scale(.95,1.08)}80%{transform:scale(1.1,.9)}100%{transform:none}}
@keyframes spin{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.2)}100%{transform:rotate(360deg) scale(1)}}
@keyframes wig{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}}
</style>
</head>
